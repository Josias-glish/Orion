[package]
name = "registro-caprino"
version = "0.5.0"
description = "Registro Caprino: genealogía, reproducción, leche, pesos y salud de cabras lecheras"
edition = "2021"
# El plugin SQL exige Rust 1.90 o superior.
rust-version = "1.90"

[lib]
# El sufijo `_lib` evita un choque de nombres entre la librería y el ejecutable en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "registro_caprino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Etapa 10 (D-057): la red la hace Rust con el plugin HTTP, sin cookies y con una sola dirección permitida
# (capabilities/sincronizacion.json). `rustls-tls` valida los certificados; `system-proxy` respeta el proxy del sistema.
tauri-plugin-http = { version = "2.8", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Etapa 10 (D-004): `ejecutar_lote` usa la misma versión de sqlx que el plugin SQL y solo SQLite (sin MySQL ni PostgreSQL).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Etapa 10 (sección 10 del diseño): llavero del sistema para la sesión. Solo el núcleo de `keyring`; los almacenes de
# Windows y macOS van aparte (más abajo) y en Linux no hay almacén: ahí `secretos.rs` responde con un error claro.
keyring-core = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Almacenes del llavero (keyring 4.x ya no los trae por separado en el crate `keyring`; ver D-058).
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

# Guía de optimización: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
