[package]
name = "registro-caprino"
version = "0.5.0"
description = "Registro Caprino: genealogía, reproducción, leche, pesos y salud de cabras lecheras"
edition = "2021"
# El plugin SQL exige Rust 1.90 o superior.
rust-version = "1.90"

[lib]
# El sufijo `_lib` evita un choque de nombres entre la librería y el ejecutable en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "registro_caprino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# D-054: el mismo sqlx que ya trae el plugin SQL; solo hace falta para ejecutar un lote dentro de una transacción.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Guía de optimización: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
